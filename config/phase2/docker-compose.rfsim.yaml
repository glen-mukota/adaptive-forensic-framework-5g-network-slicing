name: oai-two-slice-ran

services:
  oai-gnb:
    image: oaisoftwarealliance/oai-gnb@sha256:7f2a902f8331cd0517b84c70476f6ad25a77ab397858f93911c1cd1211c5c70e
    container_name: phase2-oai-gnb
    cap_add:
      - SYS_NICE
    cap_drop:
      - ALL
    environment:
      USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
      ASAN_OPTIONS: detect_leaks=0
    networks:
      oai_public:
        ipv4_address: 192.168.70.140
    volumes:
      - ./gnb-two-slice-rfsim.yaml:/opt/oai-gnb/etc/gnb.yaml:ro
    healthcheck:
      test: /bin/bash -c "pgrep nr-softmodem"
      start_period: 20s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 18

  oai-nr-ue-embb:
    image: oaisoftwarealliance/oai-nr-ue@sha256:b19e25f1f1661bec0936ec8e6f6e416d704066fa027b7af4ce664e33c5feaf38
    container_name: phase2-oai-nr-ue-embb
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 -C 3319680000 --rfsimulator.[0].serveraddr 192.168.70.140 --log_config.global_log_options level,nocolor,time
    depends_on:
      oai-gnb:
        condition: service_healthy
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      oai_public:
        ipv4_address: 192.168.70.150
    volumes:
      - ./ue-embb.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml:ro
    healthcheck:
      test: /bin/bash -c "pgrep nr-uesoftmodem"
      start_period: 20s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 24

  oai-nr-ue-mmtc:
    image: oaisoftwarealliance/oai-nr-ue@sha256:b19e25f1f1661bec0936ec8e6f6e416d704066fa027b7af4ce664e33c5feaf38
    container_name: phase2-oai-nr-ue-mmtc
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 -C 3319680000 --rfsimulator.[0].serveraddr 192.168.70.140 --log_config.global_log_options level,nocolor,time
    depends_on:
      oai-gnb:
        condition: service_healthy
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      oai_public:
        ipv4_address: 192.168.70.151
    volumes:
      - ./ue-mmtc.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml:ro
    healthcheck:
      test: /bin/bash -c "pgrep nr-uesoftmodem"
      start_period: 20s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 24

networks:
  oai_public:
    external: true
    name: oai-cn5g-public-net
